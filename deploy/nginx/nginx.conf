events {
    worker_connections 1024;
}

http {
    # --- HTTP (перенаправляет на HTTPS + обслуживает certbot) ---

    server {
        listen 80;
        server_name www.bizmap.space bizmap.space api.bizmap.space;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS Frontend ---

    server {
        listen 443 ssl;
        server_name www.bizmap.space bizmap.space;

        ssl_certificate /etc/nginx/certs/live/www.bizmap.space/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/www.bizmap.space/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --- HTTPS Backend API ---

    server {
        listen 443 ssl;
        server_name api.bizmap.space;

        ssl_certificate /etc/nginx/certs/live/www.bizmap.space/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/www.bizmap.space/privkey.pem;

        client_max_body_size 10M;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
        }
    }
}
