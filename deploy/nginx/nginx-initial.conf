# Временный конфиг БЕЗ SSL — используется только для получения сертификата
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name www.bizmap.space bizmap.space api.bizmap.space;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'BizMap is setting up SSL...';
            add_header Content-Type text/plain;
        }
    }
}
